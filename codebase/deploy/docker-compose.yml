# DCF AIT Demo — single-VM Docker Compose
# Usage: cp .env.example .env && docker compose up -d
# See Docs/DCF-AIT-PLATFORM-ARCHITECTURE.md

name: dcf-ait

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${AIT_HTTP_PORT:-4010}:80"
      - "${AIT_HTTPS_PORT:-4011}:443"
    environment:
      - APP_BASE_PATH=${APP_BASE_PATH:-/dcfintake}
      - BEHIND_REVERSE_PROXY=${BEHIND_REVERSE_PROXY:-0}
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./nginx/nginx.conf.http-only.template:/etc/nginx/nginx.conf.http-only.template:ro
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - ait-net
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/dcfintake/}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/dcfintake/api/v1}
        APP_BASE_PATH: ${APP_BASE_PATH:-/dcfintake}
    networks:
      - ait-net
    restart: unless-stopped

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-ait}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ait}}
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-aitminio}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET:-ait-artifacts}
      - MINIO_USE_SSL=false
      - JWT_SECRET=${JWT_SECRET}
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-90}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://localhost}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-dev-internal-key-change-me}
      - NLP_CONFIDENCE_THRESHOLD=${NLP_CONFIDENCE_THRESHOLD:-0.65}
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "${AIT_API_PORT:-4012}:8080"
    networks:
      - ait-net
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollamadata:/root/.ollama
    networks:
      - ait-net
    restart: unless-stopped
    # Inference API: http://ollama:11434 (ait-net only — not published to host)
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama pull ${OLLAMA_MODEL:-llama3.2:3b}"
    networks:
      - ait-net
    restart: "no"

  ai-worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-ait}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ait}}
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-aitminio}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET:-ait-artifacts}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - NLP_CONFIDENCE_THRESHOLD=${NLP_CONFIDENCE_THRESHOLD:-0.65}
      - API_BASE_URL=http://api:8080/api/v1
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-dev-internal-key-change-me}
    depends_on:
      api:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - ait-net
    restart: unless-stopped

  postgres:
    profiles: ["bundled-db"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ait}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-ait}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ait}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_HOST_PORT:-4015}:5432"
    networks:
      - ait-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ait-net
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aitminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_HOST_PORT:-4013}:9000"
      - "${MINIO_CONSOLE_PORT:-4014}:9001"
    networks:
      - ait-net
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  ollamadata:

networks:
  ait-net:
    driver: bridge
