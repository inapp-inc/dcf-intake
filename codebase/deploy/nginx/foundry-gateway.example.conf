# DCF AIT — add to your EXISTING nginx on the VM (foundry.inapp.com).
# Public URL: https://foundry.inapp.com/dcfintake/
#
# Prerequisites:
#   - Docker stack running with BEHIND_REVERSE_PROXY=1 in codebase/deploy/.env
#   - AIT_HTTP_PORT=4010 published (default) — host nginx proxies here, NOT :443
#   - Do not bind Docker to host :80/:443 (those stay with your nginx)
#
# Upstream: plain HTTP to the app container nginx on localhost:4010

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Inside server { listen 443 ssl; server_name foundry.inapp.com; ... }

location = /dcfintake {
  return 301 /dcfintake/;
}

location /dcfintake/ {
  proxy_pass http://127.0.0.1:4010/dcfintake/;
  proxy_http_version 1.1;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Prefix /dcfintake;

  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
}

# After editing:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Smoke from the VM:
#   curl -sk https://foundry.inapp.com/dcfintake/api/v1/health
