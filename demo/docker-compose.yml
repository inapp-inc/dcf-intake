# Child welfare intake demo stack (SQLite, no Redis/Postgres/MinIO)
# Usage: cp .env.example .env && cp config/ai.env.example config/ai.env && docker compose up -d --build
# Public URL: https://client-demo.inapp.com/intake/ via host nginx → :11111
# AI config: config/ai.env — switch LLM_PROVIDER post-deploy (see demo/docs/VM-RUNBOOK.md)

name: intake-demo

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${AIT_HTTP_PORT:-11111}:80"
    environment:
      - APP_BASE_PATH=${APP_BASE_PATH:-/intake}
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    volumes:
      - ./nginx/nginx.conf.http-only.template:/etc/nginx/nginx.conf.template:ro
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - demo-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/intake/}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/intake/api/v1}
        APP_BASE_PATH: ${APP_BASE_PATH:-/intake}
    networks:
      - demo-net
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - .env
      - config/ai.env
    environment:
      - PORT=8080
      - DATABASE_URL=sqlite:////data/ait.db
      - ARTIFACT_DIR=/data/artifacts
    volumes:
      - demo-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks:
      - demo-net
    restart: unless-stopped

  ai-bundle:
    build:
      context: .
      dockerfile: ai-bundle/Dockerfile
    env_file:
      - .env
      - config/ai.env
    environment:
      - DATABASE_URL=sqlite:////data/ait.db
      - ARTIFACT_DIR=/data/artifacts
      - API_BASE_URL=http://api:8080/api/v1
      - DEMO_MOCK_CCWIS_PRIOR_INCIDENTS=${DEMO_MOCK_CCWIS_PRIOR_INCIDENTS:-0}
    volumes:
      - demo-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - demo-net
    restart: unless-stopped

volumes:
  demo-data:

networks:
  demo-net:
    driver: bridge
