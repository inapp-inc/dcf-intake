<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2100" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEF1F8"/>
      <stop offset="100%" stop-color="#E4EAF4"/>
    </linearGradient>
    <linearGradient id="laneScreener" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A8A85"/>
      <stop offset="100%" stop-color="#0DAAAA"/>
    </linearGradient>
    <linearGradient id="laneSupervisor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1B3054"/>
      <stop offset="100%" stop-color="#2A4570"/>
    </linearGradient>
    <linearGradient id="laneWorker" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6C3FBF"/>
      <stop offset="100%" stop-color="#7B52C9"/>
    </linearGradient>
    <linearGradient id="laneAdmin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1B305422"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4C607A"/>
    </marker>
    <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0A8A85"/>
    </marker>
    <marker id="arrowCoral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D44530"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="2100" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#1B3054" font-family="Georgia, 'Times New Roman', serif">DCF AIT  Screening Process</text>
  <text x="600" y="76" text-anchor="middle" font-size="14" fill="#4C607A">Intake � AI pipeline � human review � supervisor decision � field investigation</text>

  <!-- Legend -->
  <g transform="translate(80, 95)">
    <rect x="0" y="0" width="1040" height="52" rx="10" fill="#FFFFFF" stroke="#DDE5F1" filter="url(#shadow)"/>
    <circle cx="28" cy="26" r="8" fill="#0A8A85"/><text x="44" y="30" font-size="12" fill="#4C607A">Screener</text>
    <circle cx="130" cy="26" r="8" fill="#1B3054"/><text x="146" y="30" font-size="12" fill="#4C607A">Supervisor</text>
    <circle cx="250" cy="26" r="8" fill="#6C3FBF"/><text x="266" y="30" font-size="12" fill="#4C607A">Field worker</text>
    <circle cx="370" cy="26" r="8" fill="#374151"/><text x="386" y="30" font-size="12" fill="#4C607A">DCF Admin (config)</text>
    <rect x="520" y="16" width="14" height="14" rx="3" fill="#E4F7F6" stroke="#0A8A85"/><text x="544" y="30" font-size="12" fill="#4C607A">AI step</text>
    <rect x="620" y="16" width="14" height="14" rx="3" fill="#FEE9E5" stroke="#D44530"/><text x="644" y="30" font-size="12" fill="#4C607A">Human gate</text>
    <rect x="740" y="16" width="14" height="14" rx="3" fill="#FEF3C7" stroke="#C97500"/><text x="764" y="30" font-size="12" fill="#4C607A">Advisory score</text>
    <text x="900" y="30" font-size="11" fill="#8A9BB8">Demo stack  advisory AI, human-in-the-loop</text>
  </g>

  <!-- ========== SCREENER LANE ========== -->
  <rect x="40" y="170" width="1120" height="720" rx="14" fill="#FFFFFF" stroke="#DDE5F1" filter="url(#shadow)"/>
  <rect x="40" y="170" width="1120" height="44" rx="14" fill="url(#laneScreener)"/>
  <rect x="40" y="200" width="1120" height="14" fill="url(#laneScreener)"/>
  <text x="72" y="200" font-size="16" font-weight="700" fill="#FFFFFF">` Screener  51A Intake</text>
  <text x="1050" y="200" text-anchor="end" font-size="12" fill="#E4F7F6">status: in_progress</text>

  <!-- Start -->
  <rect x="80" y="240" width="160" height="48" rx="8" fill="#E4F7F6" stroke="#0A8A85" stroke-width="1.5"/>
  <text x="160" y="262" text-anchor="middle" font-size="13" font-weight="600" fill="#1B3054">New case</text>
  <text x="160" y="278" text-anchor="middle" font-size="10" fill="#4C607A">+ optional emergency hint</text>

  <line x1="240" y1="264" x2="280" y2="264" stroke="#4C607A" marker-end="url(#arrow)"/>

  <!-- Audio -->
  <rect x="280" y="240" width="140" height="48" rx="8" fill="#FFFFFF" stroke="#0A8A85" stroke-width="1.5"/>
  <text x="350" y="268" text-anchor="middle" font-size="12" font-weight="600" fill="#1B3054">Upload audio</text>

  <line x1="420" y1="264" x2="460" y2="264" stroke="#0A8A85" marker-end="url(#arrowTeal)"/>

  <!-- AI Pipeline box -->
  <rect x="460" y="228" width="680" height="200" rx="12" fill="#F8FAFC" stroke="#0A8A85" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="480" y="252" font-size="13" font-weight="700" fill="#0A8A85">AI pipeline (worker)</text>

  <!-- Pipeline steps row 1 -->
  <g transform="translate(480, 268)">
    <rect x="0" y="0" width="100" height="56" rx="8" fill="#FFFFFF" stroke="#0A8A85"/>
    <text x="50" y="24" text-anchor="middle" font-size="11" font-weight="600" fill="#1B3054">Transcribe</text>
    <text x="50" y="40" text-anchor="middle" font-size="9" fill="#4C607A">Whisper ASR</text>

    <text x="108" y="30" font-size="14" fill="#8A9BB8">�</text>

    <rect x="120" y="0" width="88" height="56" rx="8" fill="#FFFFFF" stroke="#0A8A85"/>
    <text x="164" y="24" text-anchor="middle" font-size="11" font-weight="600" fill="#1B3054">Clean</text>
    <text x="164" y="40" text-anchor="middle" font-size="9" fill="#4C607A">transcript</text>

    <text x="216" y="30" font-size="14" fill="#8A9BB8">�</text>

    <rect x="228" y="0" width="100" height="56" rx="8" fill="#FFFFFF" stroke="#0A8A85"/>
    <text x="278" y="24" text-anchor="middle" font-size="11" font-weight="600" fill="#1B3054">NLP</text>
    <text x="278" y="40" text-anchor="middle" font-size="9" fill="#4C607A">51A fields (teal)</text>
  </g>

  <!-- Parallel branch -->
  <line x1="758" y1="324" x2="758" y2="340" stroke="#0A8A85"/>
  <line x1="600" y1="340" x2="920" y2="340" stroke="#0A8A85"/>
  <line x1="600" y1="340" x2="600" y2="352" stroke="#0A8A85" marker-end="url(#arrowTeal)"/>
  <line x1="920" y1="340" x2="920" y2="352" stroke="#0A8A85" marker-end="url(#arrowTeal)"/>

  <g transform="translate(480, 358)">
    <rect x="0" y="0" width="200" height="58" rx="8" fill="#FEE9E5" stroke="#D44530" stroke-width="1.5"/>
    <text x="100" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#D44530">Triage</text>
    <text x="100" y="38" text-anchor="middle" font-size="9" fill="#4C607A">Keywords + LLM indicators</text>
    <text x="100" y="50" text-anchor="middle" font-size="9" fill="#4C607A">� triage_flags (pending)</text>

    <rect x="220" y="0" width="200" height="58" rx="8" fill="#FEF3C7" stroke="#C97500" stroke-width="1.5"/>
    <text x="320" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#C97500">Risk score</text>
    <text x="320" y="38" text-anchor="middle" font-size="9" fill="#4C607A">LLM 120 advisory</text>
    <text x="320" y="50" text-anchor="middle" font-size="9" fill="#4C607A">+ contributing factors</text>

    <rect x="440" y="0" width="200" height="58" rx="8" fill="#FFFFFF" stroke="#0A8A85"/>
    <text x="540" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#1B3054">Documents</text>
    <text x="540" y="38" text-anchor="middle" font-size="9" fill="#4C607A">Supervisor summary</text>
    <text x="540" y="50" text-anchor="middle" font-size="9" fill="#4C607A">for pending review</text>
  </g>

  <line x1="800" y1="428" x2="800" y2="458" stroke="#4C607A" marker-end="url(#arrow)"/>

  <!-- Human review intake -->
  <rect x="560" y="458" width="280" height="100" rx="10" fill="#FEE9E5" stroke="#D44530" stroke-width="2"/>
  <text x="700" y="482" text-anchor="middle" font-size="13" font-weight="700" fill="#D44530">Screener review (human)</text>
  <text x="700" y="500" text-anchor="middle" font-size="10" fill="#4C607A">Confirm teal AI fields � confirm/dismiss triage flags</text>
  <text x="700" y="516" text-anchor="middle" font-size="10" fill="#4C607A">e2 confirmed flags � case.emergency = true</text>
  <text x="700" y="536" text-anchor="middle" font-size="10" fill="#4C607A">Complete 51A checkpoint (all required + AI confirmed)</text>
  <text x="700" y="552" text-anchor="middle" font-size="10" fill="#4C607A">Background checks run after checkpoint (demo mock)</text>

  <line x1="700" y1="558" x2="700" y2="588" stroke="#D44530" marker-end="url(#arrowCoral)"/>

  <!-- Submit -->
  <rect x="600" y="588" width="200" height="52" rx="8" fill="#1B3054"/>
  <text x="700" y="612" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Submit to supervisor</text>
  <text x="700" y="628" text-anchor="middle" font-size="10" fill="#A8B8D0">checkpoint locked � pending_review</text>

  <!-- Admin config feed -->
  <path d="M 1080 300 L 1140 300 L 1140 120 L 200 120 L 200 268" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="1120" y="290" text-anchor="end" font-size="10" fill="#374151">triage config</text>

  <!-- ========== SUPERVISOR LANE ========== -->
  <rect x="40" y="910" width="1120" height="480" rx="14" fill="#FFFFFF" stroke="#DDE5F1" filter="url(#shadow)"/>
  <rect x="40" y="910" width="1120" height="44" rx="14" fill="url(#laneSupervisor)"/>
  <rect x="40" y="940" width="1120" height="14" fill="url(#laneSupervisor)"/>
  <text x="72" y="940" font-size="16" font-weight="700" fill="#FFFFFF">a Supervisor  Screening</text>
  <text x="1050" y="940" text-anchor="end" font-size="12" fill="#A8B8D0">status: pending_review � &</text>

  <rect x="80" y="980" width="220" height="72" rx="10" fill="#E8EDF8" stroke="#1B3054"/>
  <text x="190" y="1004" text-anchor="middle" font-size="12" font-weight="700" fill="#1B3054">Pending review queue</text>
  <text x="190" y="1022" text-anchor="middle" font-size="10" fill="#4C607A">Sorted: emergency first</text>
  <text x="190" y="1038" text-anchor="middle" font-size="10" fill="#4C607A">AI summary + recommendation</text>

  <line x1="300" y1="1016" x2="340" y2="1016" stroke="#4C607A" marker-end="url(#arrow)"/>

  <rect x="340" y="968" width="300" height="96" rx="10" fill="#FEF3C7" stroke="#C97500" stroke-width="1.5"/>
  <text x="490" y="992" text-anchor="middle" font-size="12" font-weight="700" fill="#C97500">AI recommendation (rules)</text>
  <text x="490" y="1010" text-anchor="middle" font-size="10" fill="#4C607A">emergency � Screen In  Emergency</text>
  <text x="490" y="1024" text-anchor="middle" font-size="10" fill="#4C607A">risk e 13 � Screen In  Priority</text>
  <text x="490" y="1038" text-anchor="middle" font-size="10" fill="#4C607A">+ triage flag list appended</text>
  <text x="490" y="1054" text-anchor="middle" font-size="10" fill="#4C607A">else � Screen In  Non-Emergency</text>

  <line x1="640" y1="1016" x2="680" y2="1016" stroke="#4C607A" marker-end="url(#arrow)"/>

  <rect x="680" y="968" width="260" height="96" rx="10" fill="#FEE9E5" stroke="#D44530" stroke-width="2"/>
  <text x="810" y="992" text-anchor="middle" font-size="13" font-weight="700" fill="#D44530">Supervisor decision</text>
  <text x="810" y="1012" text-anchor="middle" font-size="10" fill="#4C607A">approve_screen_in � assigned</text>
  <text x="810" y="1028" text-anchor="middle" font-size="10" fill="#4C607A">screen_out � screened_out</text>
  <text x="810" y="1044" text-anchor="middle" font-size="10" fill="#4C607A">request_clarification � needs_clarification</text>

  <!-- Case record -->
  <rect x="980" y="980" width="160" height="72" rx="8" fill="#FFFFFF" stroke="#1B3054"/>
  <text x="1060" y="1008" text-anchor="middle" font-size="11" font-weight="600" fill="#1B3054">Full case record</text>
  <text x="1060" y="1026" text-anchor="middle" font-size="9" fill="#4C607A">51A � transcript</text>
  <text x="1060" y="1040" text-anchor="middle" font-size="9" fill="#4C607A">triage � risk � 51B</text>

  <!-- Field screening track -->
  <line x1="810" y1="1064" x2="810" y2="1094" stroke="#1B3054" marker-end="url(#arrow)"/>
  <text x="820" y="1088" font-size="10" fill="#1B3054">if screen-in</text>

  <rect x="560" y="1094" width="500" height="88" rx="10" fill="#E8EDF8" stroke="#1B3054" stroke-width="1.5"/>
  <text x="810" y="1118" text-anchor="middle" font-size="12" font-weight="700" fill="#1B3054">Field screening status</text>
  <text x="810" y="1136" text-anchor="middle" font-size="10" fill="#4C607A">Track assigned cases � worker progress � 51B returned (hasReport51b)</text>
  <text x="810" y="1154" text-anchor="middle" font-size="10" fill="#4C607A">Filter by status: assigned � report submitted � emergency</text>

  <!-- Connector from screener to supervisor -->
  <path d="M 700 640 L 700 880 L 190 880 L 190 910" fill="none" stroke="#1B3054" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="620" y="858" width="160" height="24" rx="6" fill="#1B3054"/>
  <text x="700" y="874" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">pending_review</text>

  <!-- ========== WORKER LANE ========== -->
  <rect x="40" y="1410" width="1120" height="280" rx="14" fill="#FFFFFF" stroke="#DDE5F1" filter="url(#shadow)"/>
  <rect x="40" y="1410" width="1120" height="44" rx="14" fill="url(#laneWorker)"/>
  <rect x="40" y="1440" width="1120" height="14" fill="url(#laneWorker)"/>
  <text x="72" y="1440" font-size="16" font-weight="700" fill="#FFFFFF">b Field worker  Investigation</text>
  <text x="1050" y="1440" text-anchor="end" font-size="12" fill="#EDE9FF">status: assigned � report_submitted</text>

  <path d="M 810 1182 L 810 1390 L 200 1390 L 200 1410" fill="none" stroke="#6C3FBF" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="80" y="1480" width="180" height="64" rx="8" fill="#EDE9FF" stroke="#6C3FBF"/>
  <text x="170" y="1508" text-anchor="middle" font-size="12" font-weight="600" fill="#6C3FBF">Assigned case</text>
  <text x="170" y="1526" text-anchor="middle" font-size="10" fill="#4C607A">from screen-in</text>

  <line x1="260" y1="1512" x2="300" y2="1512" stroke="#6C3FBF" marker-end="url(#arrow)"/>

  <rect x="300" y="1476" width="200" height="72" rx="8" fill="#FFFFFF" stroke="#6C3FBF" stroke-width="1.5"/>
  <text x="400" y="1504" text-anchor="middle" font-size="12" font-weight="600" fill="#1B3054">Pre-visit briefing</text>
  <text x="400" y="1522" text-anchor="middle" font-size="10" fill="#4C607A">LLM briefing pack</text>
  <text x="400" y="1538" text-anchor="middle" font-size="10" fill="#4C607A">risk � collateral � LE note</text>

  <line x1="500" y1="1512" x2="540" y2="1512" stroke="#6C3FBF" marker-end="url(#arrow)"/>

  <rect x="540" y="1476" width="200" height="72" rx="8" fill="#FFFFFF" stroke="#6C3FBF" stroke-width="1.5"/>
  <text x="640" y="1504" text-anchor="middle" font-size="12" font-weight="600" fill="#1B3054">Field visit / notes</text>
  <text x="640" y="1522" text-anchor="middle" font-size="10" fill="#4C607A">voice memo � transcript</text>

  <line x1="740" y1="1512" x2="780" y2="1512" stroke="#6C3FBF" marker-end="url(#arrow)"/>

  <rect x="780" y="1476" width="200" height="72" rx="8" fill="#D1FAE5" stroke="#0A7A55" stroke-width="1.5"/>
  <text x="880" y="1504" text-anchor="middle" font-size="12" font-weight="700" fill="#0A7A55">51B report</text>
  <text x="880" y="1522" text-anchor="middle" font-size="10" fill="#4C607A">draft � compliance � submit</text>
  <text x="880" y="1538" text-anchor="middle" font-size="10" fill="#4C607A">supervisor sees returned 51B</text>

  <rect x="1020" y="1480" width="120" height="64" rx="8" fill="#FFFFFF" stroke="#6C3FBF"/>
  <text x="1080" y="1508" text-anchor="middle" font-size="11" font-weight="600" fill="#6C3FBF">Case record</text>
  <text x="1080" y="1526" text-anchor="middle" font-size="9" fill="#4C607A">read-only view</text>

  <!-- ========== ADMIN LANE ========== -->
  <rect x="40" y="1710" width="1120" height="160" rx="14" fill="#FFFFFF" stroke="#DDE5F1" filter="url(#shadow)"/>
  <rect x="40" y="1710" width="1120" height="44" rx="14" fill="url(#laneAdmin)"/>
  <rect x="40" y="1740" width="1120" height="14" fill="url(#laneAdmin)"/>
  <text x="72" y="1740" font-size="16" font-weight="700" fill="#FFFFFF">c DCF Admin  Configuration (feeds intake AI)</text>

  <rect x="80" y="1770" width="240" height="72" rx="8" fill="#F3F4F6" stroke="#374151"/>
  <text x="200" y="1794" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Keyword patterns</text>
  <text x="200" y="1810" text-anchor="middle" font-size="9" fill="#4C607A">Regex on transcript</text>
  <text x="200" y="1824" text-anchor="middle" font-size="9" fill="#4C607A">weapon � injury � removal&</text>

  <rect x="340" y="1770" width="260" height="72" rx="8" fill="#F3F4F6" stroke="#374151"/>
  <text x="470" y="1794" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">LLM triage indicators</text>
  <text x="470" y="1810" text-anchor="middle" font-size="9" fill="#4C607A">id � label � severity</text>
  <text x="470" y="1824" text-anchor="middle" font-size="9" fill="#4C607A">injected into triage prompt</text>

  <rect x="620" y="1770" width="200" height="72" rx="8" fill="#F3F4F6" stroke="#374151"/>
  <text x="720" y="1794" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Escalation threshold</text>
  <text x="720" y="1812" text-anchor="middle" font-size="9" fill="#4C607A">default: 2 confirmed</text>
  <text x="720" y="1826" text-anchor="middle" font-size="9" fill="#4C607A">flags � emergency</text>

  <rect x="840" y="1770" width="300" height="72" rx="8" fill="#F3F4F6" stroke="#374151"/>
  <text x="990" y="1794" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">System governance</text>
  <text x="990" y="1812" text-anchor="middle" font-size="9" fill="#4C607A">No case narrative access � audit logs</text>
  <text x="990" y="1826" text-anchor="middle" font-size="9" fill="#4C607A">triage config � models � health</text>

  <!-- Risk scale footnote -->
  <rect x="40" y="1890" width="1120" height="88" rx="10" fill="#FFFFFF" stroke="#DDE5F1"/>
  <text x="72" y="1918" font-size="12" font-weight="700" fill="#1B3054">Risk score (advisory)</text>
  <text x="72" y="1938" font-size="11" fill="#4C607A">LLM chooses 120 from transcript only � clamped in code � not a validated actuarial model</text>
  <text x="72" y="1956" font-size="11" fill="#4C607A">Display bands: API High e15 / Moderate e10 � UI colors High e13 / Moderate e8 � fallback score 10 if model fails</text>
  <text x="72" y="1972" font-size="11" fill="#8A9BB8">File: demo/docs/screening-process.svg  Massachusetts DCF AIT Demo</text>
</svg>
