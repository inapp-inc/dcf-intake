# =========================================================
# Child welfare intake demo — host nginx route (client-demo.inapp.com)
# =========================================================
#
# Drop-in equivalent of:
#   sudo ./create-nginx-site.sh intake 11111
#
# Install (automatic on deploy-docker.sh, or manual):
#   sudo ./scripts/install-host-nginx.sh
#   sudo cp foundry-gateway.example.conf /etc/nginx/routes/intake.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Public URL:  https://client-demo.inapp.com/intake/
# Backend:     http://127.0.0.1:11111/intake/  (demo docker-compose AIT_HTTP_PORT)
#
# Demo .env must match:
#   APP_BASE_PATH=/intake
#   VITE_BASE_PATH=/intake/
#   VITE_API_BASE_URL=/intake/api/v1
#
# =========================================================

# =========================================================
# intake  (upstream keeps path prefix — required for path-prefixed SPA)
# =========================================================

# Scoped to /intake/ only — does not affect other apps on this host.

location /intake/ {

    # Preserve /intake/ on Docker nginx (do NOT proxy_pass to / only)
    proxy_pass http://127.0.0.1:11111/intake/;

    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 120s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    proxy_buffering off;
    proxy_redirect off;

    client_max_body_size 50m;
}
